name: Compatibility Tests for Web3.js

on:
  push:
    branches: [main, develop]
    paths:
      - 'tests/evm-tools-compatibility/web3.js/**'
      - '../../scripts/tests_compatibility_setup.sh'
      - '../../scripts/tests_compatibility_web3js.sh'
      - 'local_node.sh'
      - 'tests-compatibility-web3js.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'tests/evm-tools-compatibility/web3.js/**'
      - '../../scripts/tests_compatibility_setup.sh'
      - '../../scripts/tests_compatibility_web3js.sh'
      - 'local_node.sh'
      - 'tests-compatibility-web3js.yml'

permissions:
  contents: read

jobs:
  web3js-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git jq
      
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      
      - name: Install Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version-file: tests/evm-tools-compatibility/web3.js/package.json

      - name: Report Node version
        run: printf 'Node `%s` · npm `%s`\n' "$(node -v)" "$(npm -v)" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: tests/evm-tools-compatibility/web3.js/node_modules
          # no restore-keys: a stale fallback tree makes the setup script skip npm install
          # node version in the key: engines.node is a floating floor, and a tree
          # built for one major can't be reused across an ABI change
          key: ${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('tests/evm-tools-compatibility/web3.js/package-lock.json', 'tests/evm-tools-compatibility/web3.js/package.json') }}
      
      - name: Build and install evmd
        run: |
          make install
      
      - name: Run web3.js compatibility tests
        run: |
          chmod +x scripts/tests_compatibility_web3js.sh
          ./scripts/tests_compatibility_web3js.sh --verbose
        env:
          COMPAT_DIR: ${{ github.workspace }}/tests/evm-tools-compatibility
