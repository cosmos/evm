name: Compatibility Tests for Hardhat

on:
  push:
    branches: [main, develop]
    paths:
      - 'tests/evm-tools-compatibility/hardhat/**'
      - 'scripts/tests_compatibility_setup.sh'
      - 'scripts/tests_compatibility_hardhat.sh'
      - 'scripts/tests_compatibility_common.sh'
      - 'local_node.sh'
      - '.github/workflows/tests-compatibility-hardhat.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'tests/evm-tools-compatibility/hardhat/**'
      - 'scripts/tests_compatibility_setup.sh'
      - 'scripts/tests_compatibility_hardhat.sh'
      - 'scripts/tests_compatibility_common.sh'
      - 'local_node.sh'
      - '.github/workflows/tests-compatibility-hardhat.yml'

permissions:
  contents: read

jobs:
  hardhat-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git jq
      
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Setup pnpm and Node.js
        id: setup
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          working-directory: tests/evm-tools-compatibility/hardhat
          runtime: node@24
          cache: true
          cache-dependency-path: tests/evm-tools-compatibility/hardhat/pnpm-lock.yaml
          install: false

      - name: Report Node version
        run: printf 'Node `%s` · pnpm `%s`\n' "$(node -v)" "$(pnpm -v)" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: tests/evm-tools-compatibility/hardhat/node_modules
          # no restore-keys: a stale fallback tree makes the setup script skip install
          # node version in the key: a tree built for one major can't be reused
          # across an ABI change
          key: ${{ runner.os }}-node${{ steps.setup.outputs.runtime-version }}-pnpm-${{ hashFiles('tests/evm-tools-compatibility/hardhat/pnpm-lock.yaml', 'tests/evm-tools-compatibility/hardhat/package.json') }}
      
      - name: Build and install evmd
        run: |
          make install
      
      - name: Run hardhat compatibility tests
        run: |
          chmod +x scripts/tests_compatibility_hardhat.sh
          ./scripts/tests_compatibility_hardhat.sh --verbose
        env:
          COMPAT_DIR: ${{ github.workspace }}/tests/evm-tools-compatibility
