name: Slither Analysis

on:
  pull_request:
permissions: read-all

jobs:
  analyze:
    name: Run Slither
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get Diff
        uses: technote-space/get-diff-action@v6.1.2
        with:
          PATTERNS: |
            **/*.sol
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          working-directory: contracts
          runtime: node@24
          cache: true
          cache-dependency-path: contracts/pnpm-lock.yaml
          install: false
      - name: Report Node version
        run: printf 'Node `%s` · pnpm `%s`\n' "$(node -v)" "$(pnpm -v)" >> "$GITHUB_STEP_SUMMARY"
      - name: Node dependencies Install
        run: |
          cd contracts && pnpm install
          cp -r node_modules/@openzeppelin .
      - name: Run Slither Action
        uses: crytic/slither-action@v0.4.0
        continue-on-error: true
        id: slither
        with:
          target: contracts/
        if: "env.GIT_DIFF"
